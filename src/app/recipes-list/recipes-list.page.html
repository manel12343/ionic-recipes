<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Recipes List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar [(ngModel)]="searchTerm" (ionInput)="filterRecipes()" placeholder="Search recipes..."></ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let recipe of filteredRecipes" [routerLink]="['/recipe-detail', recipe.id]">
      <ion-thumbnail slot="start">
        <img [src]="recipe.image || 'assets/images/default-recipe.jpg'" alt="{{recipe.title}}" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{recipe.title}}</h2>
        <p>{{recipe.shortDescription}}</p>
        <p class="recipe-meta">
          <ion-icon name="time-outline"></ion-icon> {{recipe.prepTime}} min
          <ion-icon name="restaurant-outline"></ion-icon> {{recipe.servings}} servings
        </p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button [routerLink]="['/create-recipe']">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
