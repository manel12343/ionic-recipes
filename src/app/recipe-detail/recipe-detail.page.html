<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/recipes-list"></ion-back-button>
    </ion-buttons>
    <ion-title>{{recipe?.title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngIf="recipe">
    <img [src]="recipe.image || 'assets/images/default-recipe.jpg'" />

    <ion-card-header>
      <ion-card-title>{{recipe.title}}</ion-card-title>
      <ion-card-subtitle>{{recipe.shortDescription}}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>

      <h3>Ingredients</h3>
      <ion-list>
        <ion-item *ngFor="let ing of recipe.ingredients">
          {{ing}}
        </ion-item>
      </ion-list>

      <h3>Steps</h3>
      <ion-list>
        <ion-item *ngFor="let step of recipe.steps; let i = index">
          <ion-label>
            <h4>Step {{i+1}}</h4>
            <p>{{step}}</p>
          </ion-label>
        </ion-item>
      </ion-list>

    </ion-card-content>
  </ion-card>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="editRecipe()">
      <ion-icon name="create-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
