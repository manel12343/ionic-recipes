<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/recipes-list"></ion-back-button>
    </ion-buttons>
    <ion-title>{{isEditMode ? 'Edit Recipe' : 'Create Recipe'}}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="saveRecipe()" [disabled]="!recipeForm.valid">
        Save
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="recipeForm">
    <!-- Title -->
    <ion-item>
      <ion-label position="floating">Title *</ion-label>
      <ion-input formControlName="title" type="text"></ion-input>
    </ion-item>

    <!-- Short Description -->
    <ion-item>
      <ion-label position="floating">Short Description *</ion-label>
      <ion-textarea formControlName="shortDescription" rows="2"></ion-textarea>
    </ion-item>

    <!-- Image URL -->
    <ion-item>
      <ion-label position="floating">Image URL (optional)</ion-label>
      <ion-input formControlName="image" type="text"></ion-input>
    </ion-item>

    <!-- Preparation Time -->
    <ion-item>
      <ion-label position="floating">Preparation Time (minutes) *</ion-label>
      <ion-input formControlName="prepTime" type="number"></ion-input>
    </ion-item>

    <!-- Servings -->
    <ion-item>
      <ion-label position="floating">Servings *</ion-label>
      <ion-input formControlName="servings" type="number"></ion-input>
    </ion-item>

    <!-- Ingredients -->
    <ion-item>
      <ion-label>Ingredients *</ion-label>
      <ion-button fill="clear" (click)="addIngredient()">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
    
    <div formArrayName="ingredients">
      <ion-item *ngFor="let ingredient of ingredients.controls; let i = index">
        <ion-input [formControlName]="i" placeholder="Ingredient {{i + 1}}"></ion-input>
        <ion-button fill="clear" (click)="removeIngredient(i)" *ngIf="ingredients.controls.length > 1">
          <ion-icon name="remove" slot="icon-only" color="danger"></ion-icon>
        </ion-button>
      </ion-item>
    </div>

    <!-- Steps -->
    <ion-item>
      <ion-label>Steps *</ion-label>
      <ion-button fill="clear" (click)="addStep()">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
    
    <div formArrayName="steps">
      <ion-item *ngFor="let step of steps.controls; let i = index">
        <ion-textarea [formControlName]="i" rows="2" placeholder="Step {{i + 1}}"></ion-textarea>
        <ion-button fill="clear" (click)="removeStep(i)" *ngIf="steps.controls.length > 1">
          <ion-icon name="remove" slot="icon-only" color="danger"></ion-icon>
        </ion-button>
      </ion-item>
    </div>

    <!-- Notes (optional) -->
    <ion-item>
      <ion-label position="floating">Notes (optional)</ion-label>
      <ion-textarea formControlName="notes" rows="3"></ion-textarea>
    </ion-item>
  </form>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" *ngIf="isEditMode">
    <ion-fab-button color="danger" (click)="deleteRecipe()">
      <ion-icon name="trash-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
